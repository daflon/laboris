<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { font: bold 24px Inter, sans-serif; fill: #1e293b; }
      .subtitle { font: 12px Inter, sans-serif; fill: #64748b; }
      .section-title { font: bold 14px Inter, sans-serif; fill: #fff; }
      .screen-title { font: bold 11px Inter, sans-serif; fill: #1e293b; }
      .screen-desc { font: 9px Inter, sans-serif; fill: #64748b; }
      .box-tenant { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .box-master { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; rx: 8; }
      .box-auth { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .header-tenant { fill: #22c55e; }
      .header-master { fill: #06b6d4; }
      .header-auth { fill: #f59e0b; }
      .connector { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 4,2; }
      .arrow { fill: #94a3b8; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">OS Laboris — Mapa de Telas</text>
  <text x="600" y="55" text-anchor="middle" class="subtitle">Atualizado em 19/08/2026 • Sistema SaaS Multi-tenant</text>
  
  <!-- LOGIN (Auth) -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="160" height="80" class="box-auth"/>
    <rect x="0" y="0" width="160" height="24" class="header-auth" rx="8" ry="8"/>
    <rect x="0" y="12" width="160" height="12" class="header-auth"/>
    <text x="80" y="17" text-anchor="middle" class="section-title">🔐 Autenticação</text>
    <text x="80" y="45" text-anchor="middle" class="screen-title">Login</text>
    <text x="80" y="60" text-anchor="middle" class="screen-desc">Email + Senha</text>
    <text x="80" y="72" text-anchor="middle" class="screen-desc">JWT Multi-tenant</text>
  </g>
  
  <!-- Arrow from Login to Tenant/Master -->
  <path d="M 180 120 L 220 120" class="connector"/>
  <polygon points="220,116 228,120 220,124" class="arrow"/>
  
  <!-- TENANT AREA -->
  <g transform="translate(240, 80)">
    <!-- Dashboard -->
    <rect x="0" y="0" width="180" height="110" class="box-tenant"/>
    <rect x="0" y="0" width="180" height="24" class="header-tenant" rx="8" ry="8"/>
    <rect x="0" y="12" width="180" height="12" class="header-tenant"/>
    <text x="90" y="17" text-anchor="middle" class="section-title">📊 Dashboard</text>
    <text x="90" y="42" text-anchor="middle" class="screen-title">Visão Geral</text>
    <text x="90" y="56" text-anchor="middle" class="screen-desc">Cards por status (clicáveis)</text>
    <text x="90" y="68" text-anchor="middle" class="screen-desc">Ranking de técnicos 🥇🥈🥉</text>
    <text x="90" y="80" text-anchor="middle" class="screen-desc">Alertas: OS antigas, abandonadas</text>
    <text x="90" y="92" text-anchor="middle" class="screen-desc">Últimas OS criadas</text>
  </g>
  
  <!-- Ordens de Serviço -->
  <g transform="translate(440, 80)">
    <rect x="0" y="0" width="200" height="130" class="box-tenant"/>
    <rect x="0" y="0" width="200" height="24" class="header-tenant" rx="8" ry="8"/>
    <rect x="0" y="12" width="200" height="12" class="header-tenant"/>
    <text x="100" y="17" text-anchor="middle" class="section-title">📋 Ordens de Serviço</text>
    <text x="100" y="42" text-anchor="middle" class="screen-title">Lista de OS</text>
    <text x="100" y="54" text-anchor="middle" class="screen-desc">Filtros, busca, paginação</text>
    <text x="100" y="70" text-anchor="middle" class="screen-title">Nova/Editar OS</text>
    <text x="100" y="82" text-anchor="middle" class="screen-desc">Cliente, equipamento, itens, sinal</text>
    <text x="100" y="98" text-anchor="middle" class="screen-title">Detalhes da OS</text>
    <text x="100" y="110" text-anchor="middle" class="screen-desc">PDF, WhatsApp, Lote, Duplicar</text>
    <text x="100" y="122" text-anchor="middle" class="screen-desc">Campo Sinal com valor</text>
  </g>
  
  <!-- Clientes -->
  <g transform="translate(660, 80)">
    <rect x="0" y="0" width="160" height="100" class="box-tenant"/>
    <rect x="0" y="0" width="160" height="24" class="header-tenant" rx="8" ry="8"/>
    <rect x="0" y="12" width="160" height="12" class="header-tenant"/>
    <text x="80" y="17" text-anchor="middle" class="section-title">👥 Clientes</text>
    <text x="80" y="42" text-anchor="middle" class="screen-title">Lista de Clientes</text>
    <text x="80" y="54" text-anchor="middle" class="screen-desc">Busca por nome/doc/tel</text>
    <text x="80" y="70" text-anchor="middle" class="screen-title">Novo/Editar Cliente</text>
    <text x="80" y="82" text-anchor="middle" class="screen-desc">CPF/CNPJ validado</text>
    <text x="80" y="94" text-anchor="middle" class="screen-desc">Equipamentos vinculados</text>
  </g>
  
  <!-- Equipamentos -->
  <g transform="translate(840, 80)">
    <rect x="0" y="0" width="160" height="100" class="box-tenant"/>
    <rect x="0" y="0" width="160" height="24" class="header-tenant" rx="8" ry="8"/>
    <rect x="0" y="12" width="160" height="12" class="header-tenant"/>
    <text x="80" y="17" text-anchor="middle" class="section-title">🔧 Equipamentos</text>
    <text x="80" y="42" text-anchor="middle" class="screen-title">Lista de Equipamentos</text>
    <text x="80" y="54" text-anchor="middle" class="screen-desc">Tipo, marca, modelo, série</text>
    <text x="80" y="70" text-anchor="middle" class="screen-title">Novo/Editar Equipamento</text>
    <text x="80" y="82" text-anchor="middle" class="screen-desc">Vinculado a cliente</text>
    <text x="80" y="94" text-anchor="middle" class="screen-desc">Histórico de OS</text>
  </g>
  
  <!-- Técnicos -->
  <g transform="translate(1020, 80)">
    <rect x="0" y="0" width="160" height="100" class="box-tenant"/>
    <rect x="0" y="0" width="160" height="24" class="header-tenant" rx="8" ry="8"/>
    <rect x="0" y="12" width="160" height="12" class="header-tenant"/>
    <text x="80" y="17" text-anchor="middle" class="section-title">👨‍🔧 Técnicos</text>
    <text x="80" y="42" text-anchor="middle" class="screen-title">Lista de Técnicos</text>
    <text x="80" y="54" text-anchor="middle" class="screen-desc">Filtro ativo/inativo</text>
    <text x="80" y="70" text-anchor="middle" class="screen-title">Novo/Editar Técnico</text>
    <text x="80" y="82" text-anchor="middle" class="screen-desc">Nome, telefone, especialidade</text>
    <text x="80" y="94" text-anchor="middle" class="screen-desc">Toggle ativo/inativo</text>
  </g>
  
  <!-- Financeiro -->
  <g transform="translate(240, 230)">
    <rect x="0" y="0" width="200" height="120" class="box-tenant"/>
    <rect x="0" y="0" width="200" height="24" class="header-tenant" rx="8" ry="8"/>
    <rect x="0" y="12" width="200" height="12" class="header-tenant"/>
