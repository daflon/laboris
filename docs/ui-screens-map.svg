    <text x="90" y="56" text-anchor="middle" class="screen-desc">Nome, CNPJ, endereço</text>
    <text x="90" y="68" text-anchor="middle" class="screen-desc">Logo (até 200KB)</text>
    <text x="90" y="84" text-anchor="middle" class="screen-title">Personalização PDF</text>
    <text x="90" y="96" text-anchor="middle" class="screen-desc">Cabeçalho, rodapé</text>
    <text x="90" y="108" text-anchor="middle" class="screen-desc">PIN do administrador</text>
  </g>
  
