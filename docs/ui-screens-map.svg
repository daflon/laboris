  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="220" height="140" class="box-master"/>
    <rect x="0" y="0" width="220" height="24" class="header-master" rx="8" ry="8"/>
    <rect x="0" y="12" width="220" height="12" class="header-master"/>
    <text x="110" y="17" text-anchor="middle" class="section-title">👑 Master Dashboard</text>
    <text x="110" y="42" text-anchor="middle" class="screen-title">Status do Sistema</text>
    <text x="110" y="56" text-anchor="middle" class="screen-desc">🗄️ Banco de dados (latência)</text>
    <text x="110" y="68" text-anchor="middle" class="screen-desc">💾 Backups (GitHub Actions)</text>
    <text x="110" y="80" text-anchor="middle" class="screen-desc">🚀 Deploy (Render)</text>
    <text x="110" y="92" text-anchor="middle" class="screen-desc">📡 Uptime (UptimeRobot)</text>
    <text x="110" y="108" text-anchor="middle" class="screen-title">Métricas Globais</text>
    <text x="110" y="120" text-anchor="middle" class="screen-desc">Total tenants, OS, clientes</text>
    <text x="110" y="132" text-anchor="middle" class="screen-desc">Alertas de falha</text>
  </g>
  
  <!-- Gestão de Tenants -->
  <g transform="translate(340, 420)">
    <rect x="0" y="0" width="200" height="140" class="box-master"/>
    <rect x="0" y="0" width="200" height="24" class="header-master" rx="8" ry="8"/>
    <rect x="0" y="12" width="200" height="12" class="header-master"/>
