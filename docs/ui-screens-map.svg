    <text x="100" y="42" text-anchor="middle" class="screen-title">Resumo Financeiro</text>
    <text x="100" y="56" text-anchor="middle" class="screen-desc">💵 Saldo Real (em caixa)</text>
    <text x="100" y="68" text-anchor="middle" class="screen-desc">📥 A Receber (OS pendentes)</text>
    <text x="100" y="80" text-anchor="middle" class="screen-desc">📤 A Pagar (despesas)</text>
    <text x="100" y="92" text-anchor="middle" class="screen-desc">📊 Saldo Previsto</text>
    <text x="100" y="108" text-anchor="middle" class="screen-title">Lançamentos</text>
    <text x="100" y="120" text-anchor="middle" class="screen-desc">Pendente → Pago (baixa manual)</text>
  </g>
  
  <!-- Faturamento -->
  <g transform="translate(460, 230)">
    <rect x="0" y="0" width="180" height="90" class="box-tenant"/>
    <rect x="0" y="0" width="180" height="24" class="header-tenant" rx="8" ry="8"/>
    <rect x="0" y="12" width="180" height="12" class="header-tenant"/>
