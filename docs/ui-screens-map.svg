    <text x="100" y="42" text-anchor="middle" class="screen-title">Lista de Tenants</text>
    <text x="100" y="54" text-anchor="middle" class="screen-desc">Todas as empresas do SaaS</text>
    <text x="100" y="70" text-anchor="middle" class="screen-title">Criar Tenant</text>
    <text x="100" y="82" text-anchor="middle" class="screen-desc">Nome, slug, admin, módulos</text>
    <text x="100" y="98" text-anchor="middle" class="screen-title">Editar Tenant</text>
    <text x="100" y="110" text-anchor="middle" class="screen-desc">Ativar/desativar</text>
    <text x="100" y="122" text-anchor="middle" class="screen-desc">Reset de senha</text>
    <text x="100" y="134" text-anchor="middle" class="screen-desc">Módulos habilitados</text>
  </g>
  
  <!-- Impersonate -->
  <g transform="translate(560, 420)">
    <rect x="0" y="0" width="180" height="110" class="box-master"/>
    <rect x="0" y="0" width="180" height="24" class="header-master" rx="8" ry="8"/>
    <rect x="0" y="12" width="180" height="12" class="header-master"/>
    <text x="90" y="17" text-anchor="middle" class="section-title">🎭 Impersonate</text>
    <text x="90" y="42" text-anchor="middle" class="screen-title">Acessar como Tenant</text>
    <text x="90" y="56" text-anchor="middle" class="screen-desc">Ver sistema como cliente vê</text>
    <text x="90" y="72" text-anchor="middle" class="screen-title">Banner Visual</text>
    <text x="90" y="84" text-anchor="middle" class="screen-desc">Barra laranja indica modo</text>
    <text x="90" y="100" text-anchor="middle" class="screen-title">Log de Sessões</text>
    <text x="90" y="112" text-anchor="middle" class="screen-desc">Auditoria completa</text>
  </g>
  
  <!-- Audit Log -->
  <g transform="translate(760, 420)">
    <rect x="0" y="0" width="180" height="100" class="box-master"/>
    <rect x="0" y="0" width="180" height="24" class="header-master" rx="8" ry="8"/>
    <rect x="0" y="12" width="180" height="12" class="header-master"/>
    <text x="90" y="17" text-anchor="middle" class="section-title">📜 Auditoria</text>
    <text x="90" y="42" text-anchor="middle" class="screen-title">Log de Auditoria</text>
    <text x="90" y="56" text-anchor="middle" class="screen-desc">Todas as ações do sistema</text>
    <text x="90" y="68" text-anchor="middle" class="screen-desc">Filtro por tenant, ação</text>
    <text x="90" y="84" text-anchor="middle" class="screen-title">Histórico Impersonate</text>
    <text x="90" y="96" text-anchor="middle" class="screen-desc">Quem acessou, quando</text>
  </g>
  
  <!-- Uptime -->
  <g transform="translate(960, 420)">
    <rect x="0" y="0" width="160" height="100" class="box-master"/>
    <rect x="0" y="0" width="160" height="24" class="header-master" rx="8" ry="8"/>
    <rect x="0" y="12" width="160" height="12" class="header-master"/>
    <text x="80" y="17" text-anchor="middle" class="section-title">📡 Monitoramento</text>
    <text x="80" y="42" text-anchor="middle" class="screen-title">UptimeRobot</text>
    <text x="80" y="56" text-anchor="middle" class="screen-desc">Status online/offline</text>
    <text x="80" y="68" text-anchor="middle" class="screen-desc">Uptime % (7 dias)</text>
    <text x="80" y="84" text-anchor="middle" class="screen-title">Alertas</text>
    <text x="80" y="96" text-anchor="middle" class="screen-desc">Backup atrasado, DB offline</text>
  </g>

  <!-- PWA Mobile Section -->
  <g transform="translate(100, 590)">
    <rect x="0" y="0" width="1020" height="80" fill="#fef9c3" stroke="#eab308" stroke-width="2" rx="8"/>
    <rect x="0" y="0" width="1020" height="24" fill="#eab308" rx="8" ry="8"/>
    <rect x="0" y="12" width="1020" height="12" fill="#eab308"/>
    <text x="510" y="17" text-anchor="middle" class="section-title">📱 PWA Mobile — Bottom Tab Bar + Drawer "Mais"</text>
    
    <text x="100" y="45" text-anchor="middle" class="screen-title">🏠 Home</text>
    <text x="100" y="60" text-anchor="middle" class="screen-desc">Dashboard</text>
    
    <text x="250" y="45" text-anchor="middle" class="screen-title">📋 OS</text>
    <text x="250" y="60" text-anchor="middle" class="screen-desc">Ordens de Serviço</text>
    
    <text x="400" y="45" text-anchor="middle" class="screen-title">👥 Clientes</text>
    <text x="400" y="60" text-anchor="middle" class="screen-desc">Lista e cadastro</text>
    
    <text x="550" y="45" text-anchor="middle" class="screen-title">💰 Financeiro</text>
    <text x="550" y="60" text-anchor="middle" class="screen-desc">Resumo e lançamentos</text>
    
    <text x="700" y="45" text-anchor="middle" class="screen-title">⋯ Mais</text>
    <text x="700" y="60" text-anchor="middle" class="screen-desc">Drawer com:</text>
    
    <text x="850" y="45" text-anchor="middle" class="screen-desc">📈 Faturamento</text>
    <text x="850" y="57" text-anchor="middle" class="screen-desc">👨‍🔧 Técnicos</text>
    <text x="850" y="69" text-anchor="middle" class="screen-desc">🔧 Equipamentos</text>
    
    <text x="1000" y="45" text-anchor="middle" class="screen-desc">⚙️ Config</text>
    <text x="1000" y="57" text-anchor="middle" class="screen-desc">🔍 Busca</text>
    <text x="1000" y="69" text-anchor="middle" class="screen-desc">🚪 Sair</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 710)">
    <text x="0" y="0" class="screen-title">Legenda:</text>
    <rect x="80" y="-12" width="20" height="14" class="box-tenant"/>
    <text x="105" y="0" class="screen-desc">Área Tenant (Verde)</text>
    <rect x="220" y="-12" width="20" height="14" class="box-master"/>
    <text x="245" y="0" class="screen-desc">Área Master (Cyan)</text>
    <rect x="360" y="-12" width="20" height="14" class="box-auth"/>
    <text x="385" y="0" class="screen-desc">Autenticação (Amber)</text>
    <rect x="520" y="-12" width="20" height="14" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
    <text x="545" y="0" class="screen-desc">Mobile PWA (Yellow)</text>
  </g>

  <!-- Footer -->
  <text x="600" y="760" text-anchor="middle" class="subtitle">OS Laboris v1.0 • Sistema SaaS Multi-tenant de Gestão de Ordens de Serviço</text>
  <text x="600" y="778" text-anchor="middle" class="subtitle">Stack: React + TypeScript + Node.js + PostgreSQL (Neon) • Deploy: Render</text>
</svg>
