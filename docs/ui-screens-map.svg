    <text x="90" y="56" text-anchor="middle" class="screen-desc">Receitas por período</text>
    <text x="90" y="68" text-anchor="middle" class="screen-desc">Por técnico, por status</text>
    <text x="90" y="80" text-anchor="middle" class="screen-desc">Exportar dados</text>
  </g>
  
