    <text x="80" y="42" text-anchor="middle" class="screen-title">Adicionar ao Lote</text>
    <text x="80" y="54" text-anchor="middle" class="screen-desc">Mesmo cliente, múltiplos equip.</text>
    <text x="80" y="70" text-anchor="middle" class="screen-title">PDF do Lote</text>
    <text x="80" y="82" text-anchor="middle" class="screen-desc">Individual ou Resumo</text>
  </g>

  <!-- Separator -->
